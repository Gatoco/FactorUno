services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      FACTORUNO_SECRET: ${FACTORUNO_SECRET:?FACTORUNO_SECRET obligatorio, genera uno con openssl rand -hex 32}
      FACTORUNO_SEED_DEMO: ${FACTORUNO_SEED_DEMO:-0}
      FACTORUNO_ADMIN_PASSWORD: ${FACTORUNO_ADMIN_PASSWORD:-}
      FACTORUNO_ANALISTA_PASSWORD: ${FACTORUNO_ANALISTA_PASSWORD:-}
      FACTORUNO_CONSULTA_PASSWORD: ${FACTORUNO_CONSULTA_PASSWORD:-}
      FACTORUNO_TOKEN_HORAS: ${FACTORUNO_TOKEN_HORAS:-8}
      FACTORUNO_CORS_ORIGINS: ${FACTORUNO_CORS_ORIGINS:-}
      FACTORUNO_DYNAMO_TABLA: ${FACTORUNO_DYNAMO_TABLA:-}
      FACTORUNO_S3_BUCKET: ${FACTORUNO_S3_BUCKET:-}
    volumes:
      - db_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
